project:
  author: null
  description: null
  name: pdf2anki
  version: '1.0'

inputs:
  paths:
  - pdfs/
  patterns:
  - '*.pdf'
  recursive: true

generate:
  anki:
    deck_id: null
    deck_name: PDF2Anki
    deck_structure: workflow  # workflow|flat|chapter|theme - "workflow" puts each source
                              # (Readwise/Articles/Textbooks::BookName) in its own subdeck
    note_types: {}
    preserve_latex: true
  ids:
    salt: pdf2anki
    strategy: content_hash
  language: en
  output:
    apkg_path: workspace\deck.apkg
    csv_path: workspace\cards.csv
    manifest_path: workspace\manifest.json
    media_path: workspace\media
    workspace: workspace
  strategies:
    - name: 'basic_key_points'
      prompt: "key_points"
      note: "basic"
  tags:
    auto_generate: true
    default_tags: [ ]
    include_source: true
    include_strategy: true
  taxonomy:
    auto_detect: true
    hierarchical: true
    max_depth: 3

pipeline:
  deduplication:
    embedding_threshold: 0.9
    enabled: true
    fuzzy_threshold: 0.85
    index_path: null
    policy: or
    scope_persistent: false
    scope_within_run: true
  hallucination:
    drop_on_failure: true
    require_citations: true
    verify_quotes: true
  ingestion:
    chunking:
      enable_trimming: true
      max_chunk_tokens: 4000
      min_chunk_tokens: 100
      mode: smart
      overlap_tokens: 200
      respect_page_bounds: true
      token_budget: 8000
      tokens_per_chunk: 2000
    extract_images: true
    extract_tables: false
    mode: extract_text
    ocr_fallback: false
  llm:
    api_key: null
    base_url: null
    max_retries: 3
    max_tokens: null
    model: gpt-4-1106-preview
    provider: openai
    seed: null
    temperature: 0.0
    timeout: 120
  rag:
    embedding_model: text-embedding-3-large
    enabled: false
    index_path: null
    k: 5
    provider: faiss
  review:
    allow_edits: true
    enabled: false
    min_score: 7.0
    template_version: '1.0'
  telemetry:
    enabled: true
    track_cache_hits: true
    track_costs: true
    track_timing: true
    track_tokens: true
